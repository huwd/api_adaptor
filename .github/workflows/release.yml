name: Release RubyGem

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run all checks/build steps but do not publish"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: Validate tag format
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$'; then
            echo "Error: Tag '$TAG' does not match expected format (e.g., v1.0.0, v1.0.0-beta.1)"
            exit 1
          fi
          echo "Tag format is valid: $TAG"

      - name: Determine version + tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(ruby -r ./lib/api_adaptor/version -e 'puts ApiAdaptor::VERSION')"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # For workflow_dispatch, use the version from the code
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: "Preflight: tag must match ApiAdaptor::VERSION"
        shell: bash
        run: |
          set -euo pipefail
          test "v${{ steps.meta.outputs.version }}" = "${{ steps.meta.outputs.tag }}"

      - name: "Preflight: CHANGELOG must mention this version"
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq "(^##\\s*\\[?${{ steps.meta.outputs.version }}\\]?)|(^##\\s*${{ steps.meta.outputs.version }})" CHANGELOG.md

      - name: Run test suite
        shell: bash
        run: bundle exec rspec

      - name: Run RuboCop
        shell: bash
        run: bundle exec rubocop

      - name: Build gem
        run: bundle exec rake build

      - name: Install built gem and require it
        run: |
          set -euo pipefail
          GEM_FILE="$(ls -1 pkg/*.gem | head -n 1)"
          gem install "$GEM_FILE" --no-document
          ruby -r api_adaptor -e 'puts ApiAdaptor::VERSION'

      - name: Publish to RubyGems (Trusted Publishing / OIDC)
        if: ${{ github.event_name == 'push' || inputs.dry_run == 'false' }}
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
